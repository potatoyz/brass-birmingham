<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" href="data:,">
<title>工业革命：伯明翰 3D（联机版）</title>
<link rel="stylesheet" href="css/three.css?v=5">
</head>
<body>
<!-- 首页 -->
<section id="home" class="screen active">
  <div class="home-card">
    <h1>工业革命：伯明翰</h1>
    <p class="sub">3D 联机版 · 2–4 人 · 可加 AI</p>
    <label>昵称<input id="name" maxlength="16" placeholder="你的名字" autocomplete="nickname"></label>
    <div class="grp">
      <div class="grp-h">创建房间</div>
      <div class="row-btns">
        <button data-create="2">2 人房</button><button data-create="3">3 人房</button><button data-create="4">4 人房</button>
      </div>
      <div class="row-btns">
        <button data-create="2" data-solo="1" class="ghost">单挑 1 个 AI</button><button data-create="4" data-solo="1" class="ghost">对战 3 个 AI</button>
      </div>
    </div>
    <div class="grp">
      <div class="grp-h">加入房间</div>
      <div class="row-btns"><input id="code" maxlength="4" placeholder="4 位房间号" autocapitalize="characters"><button id="join" class="primary">加入</button></div>
    </div>
    <div id="home-msg" class="msg"></div>
  </div>
</section>

<!-- 房间大厅 -->
<section id="lobby" class="screen">
  <div class="home-card wide">
    <h2>房间 <span id="lobby-code" class="code"></span></h2>
    <div class="row-btns"><input id="lobby-link" readonly><button id="lobby-copy">复制邀请链接</button></div>
    <div class="seat-count">座位数：<button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button></div>
    <div id="lobby-seats"></div>
    <div id="lobby-spec" class="muted"></div>
    <div id="lobby-hint" class="msg"></div>
    <div class="row-btns"><button id="lobby-leave" class="ghost">离开房间</button><button id="lobby-start" class="primary">开始游戏</button></div>
  </div>
</section>

<!-- 对局 -->
<section id="game" class="screen">
  <div id="stage"></div>
  <!-- 自己：常驻、醒目 -->
  <div id="hud" class="hud">
    <div class="hud-top"><span id="hud-badge"></span><span id="hud-money" class="money" title="你的资金"><i data-ic="coin"></i><b>0</b></span></div>
    <div class="hud-stats">
      <span class="st" id="hud-income" title="收入（每轮结束时领取）"><i data-ic="income"></i><b></b></span>
      <span class="st" id="hud-vp" title="胜利点"><i data-ic="vp"></i><b></b></span>
      <span class="st" id="hud-acts" title="本回合剩余动作"></span>
    </div>
    <div class="hud-era"><span id="era" class="era"></span><span id="round"></span></div>
  </div>
  <!-- 对手：紧凑头像条 -->
  <div id="opps" class="opps"></div>
  <!-- 工具栏 -->
  <div id="toolbar" class="toolbar">
    <span class="room" title="房间号"><b id="room-code"></b><i id="net-dot" class="dot"></i></span>
    <button id="btn-reclaim" class="txt" hidden>收回控制</button>
    <button id="btn-panels" class="m-only ib" title="产业板"><i data-ic="factory"></i></button>
    <button id="btn-board" class="ib d-only" title="完整产业板"><i data-ic="factory"></i></button>
    <button id="btn-market" class="ib" title="市场与牌堆"><i data-ic="market"></i></button>
    <button id="btn-log" class="ib" title="日志"><i data-ic="log"></i></button>
    <button id="btn-seats" class="ib" title="玩家与座位"><i data-ic="users"></i></button>
    <button id="btn-settings" class="ib" title="动画与声音"><i data-ic="settings"></i></button>
    <button id="btn-exit" class="ib" title="退出"><i data-ic="exit"></i></button>
  </div>
  <!-- 右侧：只有"下一块"的图标摘要 -->
  <aside id="side-right" class="side">
    <div class="side-h">下一块 <button id="btn-board2" class="mini" title="查看完整产业板">全部 ▸</button></div>
    <div id="mat"></div>
    <div id="mk-mini" class="mk-mini" title="点击查看市场"></div>
  </aside>
  <div id="ticker" class="ticker" title="点击查看完整日志"></div>
  <div id="log" class="log"></div>
  <div id="view-ctl">
    <button id="btn-zoom-in" class="ib" title="放大"><i data-ic="plus"></i></button><button id="btn-zoom-out" class="ib" title="缩小"><i data-ic="minus"></i></button><button id="btn-view" class="ib" title="复位视角"><i data-ic="reset"></i></button>
  </div>
  <div id="annot-ctl" class="annot-ctl">
    <button id="an-ping" class="ib" title="信号：点版图发一个所有人可见的提示（也可 Alt+点击）"><i data-ic="ping"></i></button>
    <button id="an-pen" class="ib" title="画笔：在版图上拖动画线，所有人可见"><i data-ic="pen"></i></button>
    <button id="an-keep" class="ib an-sub" title="笔迹保留到手动清除（关闭则 60 秒后淡出）" hidden><i data-ic="pin"></i></button>
    <button id="an-clear" class="ib an-sub" title="清除我的笔迹" hidden><i data-ic="eraser"></i></button>
    <button id="an-clear-all" class="ib an-sub" title="清除所有人的笔迹" hidden><i data-ic="trash"></i></button>
  </div>
  <div id="dock">
    <div id="panel" class="panel"></div>
    <div id="actions"></div>
    <div id="hand"></div>
  </div>
</section>

<div id="modal" class="modal" hidden><div class="modal-box"><button id="modal-close" class="x">×</button><h3 id="modal-title"></h3><div id="modal-body"></div></div></div>
<div id="tip" class="tip" hidden></div>
<div id="preview" class="preview" hidden></div>
<div id="toasts"></div>

<script src="js/gameData.js?v=4"></script>
<script src="js/gameState.js?v=4"></script>
<script src="js/gameLogic.js?v=6"></script>
<script src="js/aiPlayer.js?v=4"></script>
<script src="js/boardAssets.js?v=4"></script>
<script src="js/three/bb3d.min.js?v=5"></script>
</body>
</html>
