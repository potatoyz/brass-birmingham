<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>工业革命：伯明翰（联机版）</title>
    <link rel="stylesheet" href="css/style.css?v=7">
    <link rel="stylesheet" href="css/online.css?v=2">
    <link rel="stylesheet" href="css/readability.css?v=1">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Source+Sans+Pro:wght@300;400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
</head>
<body>
    <!-- Setup Screen -->
    <div id="setup-screen" class="screen active">
        <div class="setup-container">
            <h1 class="game-title">工业革命</h1>
            <h2 class="game-subtitle">伯明翰</h2>
            <p class="game-tagline">经济策略游戏 &middot; 1770&ndash;1870</p>

            <!-- Online play (rooms) -->
            <div class="online-panel" id="online-panel">
                <div class="online-panel-title">联机对战 · 多设备开房间</div>
                <input type="text" id="online-name" class="online-input" maxlength="16" placeholder="你的昵称">
                <button id="create-room-btn" class="btn-primary">创建房间</button>
                <div class="online-join-row">
                    <input type="text" id="join-code" class="online-input" maxlength="4" placeholder="房间号（4 位）" autocomplete="off">
                    <button id="join-room-btn" class="online-btn">加入房间</button>
                </div>
                <div id="online-msg" class="online-msg"></div>
            </div>

            <details class="local-mode">
            <summary>本机同屏模式（一台设备轮流玩）</summary>
            <div class="setup-form">
                <div class="form-group">
                    <label>玩家人数</label>
                    <div class="player-count-selector">
                        <button class="count-btn" data-count="2">2</button>
                        <button class="count-btn active" data-count="3">3</button>
                        <button class="count-btn" data-count="4">4</button>
                    </div>
                </div>

                <div id="player-names" class="form-group">
                    <label>玩家名称</label>
                    <div class="player-name-inputs"></div>
                </div>

                <button id="start-game-btn" class="btn-primary">开始游戏</button>
            </div>
            </details>
        </div>
    </div>

    <!-- Online Lobby Screen -->
    <div id="lobby-screen" class="screen">
        <div class="setup-container lobby-container">
            <div class="lobby-title">房间 <span id="lobby-code" class="lobby-code"></span></div>
            <div class="lobby-share">
                <input type="text" id="lobby-link" class="online-input" readonly>
                <button id="copy-link-btn" class="online-btn">复制邀请链接</button>
            </div>
            <div class="lobby-count" id="lobby-count">
                <span>玩家人数</span>
                <button class="lobby-count-btn" data-n="2">2</button>
                <button class="lobby-count-btn" data-n="3">3</button>
                <button class="lobby-count-btn" data-n="4">4</button>
            </div>
            <div id="lobby-seats"></div>
            <div id="lobby-spectators" class="lobby-hint"></div>
            <div class="lobby-actions">
                <button id="lobby-start-btn" class="btn-primary">开始游戏</button>
                <button id="lobby-leave-btn" class="online-btn">离开房间</button>
            </div>
            <div id="lobby-hint" class="lobby-hint"></div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen">
        <!-- Top Bar -->
        <div id="top-bar">
            <div class="era-indicator">
                <span id="era-label">运河时代</span>
                <span id="round-label">第 1 轮</span>
            </div>
            <div class="turn-info">
                <span id="current-player-label"></span>
                <span id="actions-remaining-label"></span>
            </div>
            <div id="online-bar" class="hidden">
                <span class="online-dot" id="online-dot"></span>
                <span>房间 <b id="online-bar-code"></b></span>
                <button class="online-mini-btn hidden" id="reclaim-btn">收回控制</button>
                <button class="online-mini-btn" id="seats-btn">玩家</button>
                <button class="online-mini-btn" id="exit-room-btn">退出</button>
            </div>
            <div class="market-summary">
                <div class="market-item" id="coal-market-summary">
                    <span class="market-icon coal-icon"></span>
                    <span>煤炭：<span id="coal-price">£1</span></span>
                </div>
                <div class="market-item" id="iron-market-summary">
                    <span class="market-icon iron-icon"></span>
                    <span>铁：<span id="iron-price">£1</span></span>
                </div>
            </div>
        </div>

        <!-- Action Phase Indicator Bar -->
        <div id="action-phase-bar" class="hidden">
            <div class="phase-steps">
                <div class="phase-step" data-step="1">
                    <span class="phase-step-num">1</span>
                    <span class="phase-step-label">选择行动</span>
                </div>
                <div class="phase-step-arrow">&#9654;</div>
                <div class="phase-step" data-step="2">
                    <span class="phase-step-num">2</span>
                    <span class="phase-step-label">选择目标</span>
                </div>
                <div class="phase-step-arrow">&#9654;</div>
                <div class="phase-step" data-step="3">
                    <span class="phase-step-num">3</span>
                    <span class="phase-step-label">弃牌</span>
                </div>
            </div>
            <div class="phase-instruction" id="phase-instruction">请选择一个行动</div>
            <button class="phase-cancel-btn" id="phase-cancel-btn">取消</button>
        </div>

        <!-- Main Game Area -->
        <div id="game-area">
            <!-- Board -->
            <div id="board-container">
                <svg id="game-board" viewBox="-46 -46 992 942" preserveAspectRatio="xMidYMid meet">
                    <!-- Board content rendered by JS -->
                </svg>
            </div>

            <!-- Right Panel -->
            <div id="right-panel">
                <!-- Player Info Panels -->
                <div id="player-panels"></div>

                <!-- Markets -->
                <div id="markets-panel">
                    <h3>市场</h3>
                    <div id="coal-market" class="market">
                        <div class="market-header">
                            <div class="market-label">煤炭</div>
                            <div class="market-current-price" id="coal-current-price"></div>
                        </div>
                        <div class="market-track" id="coal-track"></div>
                    </div>
                    <div id="iron-market" class="market">
                        <div class="market-header">
                            <div class="market-label">铁</div>
                            <div class="market-current-price" id="iron-current-price"></div>
                        </div>
                        <div class="market-track" id="iron-track"></div>
                    </div>
                </div>

                <!-- Game Log -->
                <div id="game-log-panel">
                    <h3>游戏日志</h3>
                    <div id="game-log"></div>
                </div>
            </div>
        </div>

        <!-- Bottom Panel - Player Hand & Actions -->
        <div id="bottom-panel">
            <div id="hand-container">
                <div class="hand-label" id="hand-label">你的手牌</div>
                <div id="player-hand"></div>
            </div>
            <div id="action-panel">
                <div class="action-label">行动</div>
                <div id="action-buttons">
                    <button class="action-btn action-build" data-action="build" title="建造一个产业板块">
                        <span class="action-pip"></span>
                        <span class="action-label-text">建造</span>
                    </button>
                    <button class="action-btn action-network" data-action="network" title="建造运河或铁路">
                        <span class="action-pip"></span>
                        <span class="action-label-text">建网</span>
                    </button>
                    <button class="action-btn action-develop" data-action="develop" title="移除低等级板块">
                        <span class="action-pip"></span>
                        <span class="action-label-text">发展</span>
                    </button>
                    <button class="action-btn action-sell" data-action="sell" title="出售棉花、商品或陶瓷">
                        <span class="action-pip"></span>
                        <span class="action-label-text">销售</span>
                    </button>
                    <button class="action-btn action-loan" data-action="loan" title="贷款 £30">
                        <span class="action-pip"></span>
                        <span class="action-label-text">贷款</span>
                    </button>
                    <button class="action-btn action-scout" data-action="scout" title="弃 3 张牌换 2 张万能牌">
                        <span class="action-pip"></span>
                        <span class="action-label-text">侦察</span>
                    </button>
                    <button class="action-btn action-pass pass-btn" data-action="pass" title="跳过（弃一张牌）">
                        <span class="action-pip"></span>
                        <span class="action-label-text">跳过</span>
                    </button>
                </div>
            </div>
            <!-- Player Mat (industry tiles remaining) -->
            <div id="player-mat-container">
                <div class="mat-label" id="mat-label">你的产业板块</div>
                <div id="player-mat"></div>
            </div>
        </div>
    </div>

    <!-- Modal Overlay -->
    <div id="modal-overlay" class="hidden">
        <div id="modal-content">
            <div id="modal-header">
                <h3 id="modal-title"></h3>
                <button id="modal-close">&times;</button>
            </div>
            <div id="modal-body"></div>
            <div id="modal-footer"></div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <!-- Scoring Overlay -->
    <div id="scoring-overlay" class="hidden">
        <div class="scoring-content">
            <h2 id="scoring-title">时代计分</h2>
            <div id="scoring-details"></div>
            <button id="scoring-continue-btn" class="btn-primary">继续</button>
        </div>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameover-overlay" class="hidden">
        <div class="gameover-content">
            <h1>游戏结束</h1>
            <div id="final-scores"></div>
            <button id="new-game-btn" class="btn-primary">新游戏</button>
        </div>
    </div>

    <!-- Turn Transition Overlay -->
    <div id="turn-transition" class="hidden">
        <div class="turn-transition-content">
            <div class="turn-transition-name" id="turn-transition-name"></div>
            <div class="turn-transition-subtitle">你的回合</div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/gameData.js?v=4"></script>
    <script src="js/industryIcons.js?v=3"></script>
    <script src="js/gameState.js?v=4"></script>
    <script src="js/gameLogic.js?v=5"></script>
    <script src="js/aiPlayer.js?v=4"></script>
    <script src="js/actionIcons.js?v=3"></script>
    <script src="js/boardAssets.js?v=4"></script>
    <script src="js/boardRenderer.js?v=5"></script>
    <script src="js/uiManager.js?v=7"></script>
    <script src="js/online.js?v=1"></script>
    <script src="js/hoverPreview.js?v=1"></script>
    <script src="js/main.js?v=5"></script>
</body>
</html>
